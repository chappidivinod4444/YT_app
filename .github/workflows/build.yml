name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Live check: search and stream access (informational)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vidflow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vidflow-apk
          path: Vidflow.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Vidflow.apk \
            --title "Vidflow build ${{ github.run_number }}" \
            --notes "Download Vidflow.apk below and open it on your phone to install."

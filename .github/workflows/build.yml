name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Probe
        run: gradle testDebugUnitTest --no-daemon

      - name: API dump
        if: always()
        run: |
          set +e
          J=$(find ~/.gradle -name "*xtractor*v0.27.1*.jar" | grep -v sources | head -3); echo "JARS $J"
          CP=$(echo $J | tr ' ' ':')
          for c in org.schabi.newpipe.extractor.services.youtube.YoutubeParsingHelper org.schabi.newpipe.extractor.services.youtube.dashmanifestcreators.YoutubeProgressiveDashManifestCreator org.schabi.newpipe.extractor.services.youtube.ItagItem org.schabi.newpipe.extractor.stream.Stream org.schabi.newpipe.extractor.services.youtube.PoTokenProvider org.schabi.newpipe.extractor.services.youtube.extractors.YoutubeStreamExtractor; do
            javap -cp "$CP" -public $c 2>&1 | grep -iE "class |interface |UserAgent|StreamingUrl|fromItag|getCache|fromStreamingUrl|PoToken|getContent|isUrl|DeliveryMethod|Error" | sed 's/^/API /'
          done

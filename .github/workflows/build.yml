name: Build APK
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          git clone -q --depth 1 -b dev https://github.com/TeamNewPipe/NewPipe np
          cd np
          echo "== potoken / player datasource files"
          find . -path ./node_modules -prune -o \( -iname '*potoken*' -o -iname '*DataSource*' -o -iname 'DownloaderImpl*' -o -iname '*BotGuard*' -o -iname '*.js' -path '*assets*' \) -print | sed 's/^/F /'
          grep -rn "setPoTokenProvider\|PoTokenProvider" --include=*.kt --include=*.java app/src/main | head -20 | sed 's/^/G /'
          for f in $(find app/src/main -iname '*potoken*' -o -iname 'YoutubeHttpDataSource*' -o -iname 'PlayerDataSource*' -o -iname 'DownloaderImpl*' | grep -E '\.(kt|java)$'); do echo "== $f $(wc -l < $f)"; done | sed 's/^/S /'

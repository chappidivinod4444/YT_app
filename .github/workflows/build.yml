name: Build APK
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          git clone -q --depth 1 -b dev https://github.com/TeamNewPipe/NewPipe np
          cd np/app/src/main/java/org/schabi/newpipe
          for f in util/potoken/PoTokenProviderImpl.kt util/potoken/PoTokenWebView.kt util/potoken/PoTokenGenerator.kt DownloaderImpl.java player/helper/PlayerDataSource.java; do
            echo "=====FILE $f"; cat "$f"
          done
          echo "=====FILE grep-yt-datasource"
          grep -n "range\|rn=\|Header\|USER_AGENT\|isAndroid\|isIos\|isWeb\|getAndroidUserAgent\|getIosUserAgent\|ORIGIN\|REFERER\|POST\|alr\|class \|public .*(\|setRequestProperty\|connection\.\|getRequestUrl\|buildRequestUrl\|cpn" player/datasource/YoutubeHttpDataSource.java | head -220
          echo "=====FILE potoken-assets"
          ls ../../../../../assets 2>/dev/null
